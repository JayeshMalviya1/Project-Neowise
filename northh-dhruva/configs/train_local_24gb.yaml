# Northh Dhruva (Project BHARAT-LLM) Local 24GB GPU Training Configuration
# Targeted for RTX 3090 / 4090 / A10G (24GB VRAM) with 16,384 vocab & bfloat16 AMP

model:
  vocab_size: 16384           # Scaled 16K Byte-Level BPE vocabulary
  dim: 640                    # Model hidden dimension
  n_layers: 12                # Number of Transformer decoder blocks
  n_heads: 10                 # Query attention heads
  n_kv_heads: 2               # Grouped-Query Attention (5:1 ratio)
  intermediate_size: 1792     # SwiGLU hidden dimension (multiple of 128)
  max_seq_len: 1024           # Context length for 24GB local pretraining
  rope_theta: 500000.0        # RoPE base frequency
  rms_norm_eps: 1.0e-5        # RMSNorm numerical stability epsilon
  tie_word_embeddings: true   # Weight-tied input embeddings and LM head
  initializer_range: 0.02     # Standard normal initialization std

training:
  micro_batch_size: 8         # Per-step micro-batch size
  seq_len: 1024               # Training sequence length
  grad_accum_steps: 8         # Effective batch size = 8 * 8 * 1024 = 65,536 tokens/step
  max_steps: 2000             # Total optimization steps
  max_lr: 6.0e-4              # Peak cosine learning rate
  min_lr: 6.0e-5              # Final cosine learning rate
  warmup_steps: 100           # Linear warmup steps
  weight_decay: 0.1           # Decoupled AdamW weight decay
  grad_clip: 1.0              # Gradient L2 norm clipping threshold
  dtype: "bfloat16"           # Mixed precision dtype on Ampere+ GPUs
  checkpoint_dir: "./checkpoints/dhruva_local_16k"
  save_interval: 200          # Checkpoint & validation eval frequency
  log_interval: 10            # Console logging interval
  eval_interval: 200          # Validation perplexity evaluation interval

data:
  train_shards_dir: "./data/shards/train"
  val_shards_dir: "./data/shards/val"
  tokenizer_dir: "./data/tokenizer_16k"
